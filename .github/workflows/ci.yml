name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host:
    name: ホストでの検査
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Cのライブラリを入れる
        run: sudo apt-get update && sudo apt-get install -y libpixman-1-dev libxkbcommon-dev
      - name: Rustを入れる(rust-toolchain.tomlの版)
        run: rustup show active-toolchain || rustup toolchain install
      - name: 整形
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # 取得したフォントは、キャッシュに入れておく。配布元が止まっていても、キャッシュがあれば先へ進める。
      # キャッシュから戻したファイルも、次の手順がSHA-256を確かめ、合わなければ取り直す。
      - name: フォントのキャッシュ
        uses: actions/cache@v6
        with:
          path: target/fonts
          key: fonts-${{ hashFiles('tools/fetch-fonts.sh') }}
      - name: フォントを取得する(題名を描くテストが使う)
        run: tools/fetch-fonts.sh
      - name: ビルド(テストが使う実行ファイルを先に作る)
        run: cargo build --workspace --locked
      - name: テスト
        run: cargo test --workspace --locked
      - name: 受け口とfbdevの構成に、入れ子の裏側が入っていないこと
        run: tools/check-deps.sh seinas-standalone smithay-client-toolkit wayland-client calloop-wayland-source
      - name: 共通の描画だけのテスト(受け口を含めずにビルドする)
        run: cargo test -p seinas-render --locked
      - name: fbdevの裏側に、Waylandの受け口が入っていないこと
        run: |
          cargo build --locked -p seinas-fbdev
          tools/check-no-wayland.sh seinas-fbdev target/debug/seinas-fbdev
          target/debug/seinas-fbdev --dry-run
      - name: 文字を描かない構成に、文字を描くクレートが入っていないこと
        run: |
          tools/check-deps.sh seinas-fbdev seinas-text cosmic-text swash fontdb
          tools/check-deps.sh seinas-render seinas-text cosmic-text swash fontdb
      - name: 依存の一覧とライセンス文が最新か
        run: python3 tools/third-party.py --check

  musl:
    name: muslでの静的ビルド
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: ビルドの道具を入れる
        run: sudo apt-get update && sudo apt-get install -y musl-tools meson ninja-build bison
      - name: Rustを入れる(rust-toolchain.tomlの版)
        run: rustup show active-toolchain || rustup toolchain install
      - name: 静的ビルド(Cのライブラリもソースから作る)
        run: tools/build-musl.sh
      - name: ELFの記録
        run: tools/elf-report.sh target/x86_64-unknown-linux-musl/release/seinas target/x86_64-unknown-linux-musl/release/seinas-standalone target/x86_64-unknown-linux-musl/release/seinas-fbdev target/x86_64-unknown-linux-musl/release/zeyes-min
      # 取得したフォントは、キャッシュに入れておく。配布元が止まっていても、キャッシュがあれば先へ進める。
      # キャッシュから戻したファイルも、次の手順がSHA-256を確かめ、合わなければ取り直す。
      - name: フォントのキャッシュ
        uses: actions/cache@v6
        with:
          path: target/fonts
          key: fonts-${{ hashFiles('tools/fetch-fonts.sh') }}
      - name: フォントを取得する(題名を描くテストが使う)
        run: tools/fetch-fonts.sh
      - name: musl向けのテスト
        run: CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS="-L native=$PWD/target/musl-libs/lib" cargo test --workspace --locked --target x86_64-unknown-linux-musl
