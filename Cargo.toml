[workspace]
resolver = "2"
# trials/ の下は、採るかどうかを決める前の試し。本体のワークスペースと依存の一覧には入れない。
exclude = ["trials"]
members = [
    "crates/seinas-render",
    "crates/seinas-text",
    "crates/seinas-frontend",
    "crates/seinas",
    "crates/seinas-fbdev",
    "crates/seinas-standalone",
    "crates/seinas-test-clients",
    "crates/zeyes-min",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tsolsikke/seinas"
publish = false

# 版はここでまとめて決め、Cargo.lock で固定する。
[workspace.dependencies]
smithay = { version = "=0.7.0", default-features = false }
smithay-client-toolkit = { version = "=0.21.1", default-features = false, features = ["calloop"] }
calloop = "0.14"
pixman = "0.2"
wayland-client = "0.31"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
libc = "0.2"
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "swash"] }
