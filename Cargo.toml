[workspace]
resolver = "2"
# trials/ の下は、採るかどうかを決める前の試し。本体のワークスペースと依存の一覧には入れない。
exclude = ["trials"]
members = [
    "crates/seinas-render",
    "crates/seinas-text",
    "crates/seinas-config",
    "crates/seinas-golden",
    "crates/seinas-frontend",
    "crates/seinas",
    "crates/seinas-fbdev",
    "crates/seinas-standalone",
    "crates/seinas-test-clients",
    "crates/zeyes-min",
    "crates/seinas-taskbar",
    "crates/seinas-wallpaper",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tsolsikke/seinas"
publish = false

# バージョンはここでまとめて決め、Cargo.lock で固定する。
[workspace.dependencies]
smithay = { version = "=0.7.0", default-features = false }
smithay-client-toolkit = { version = "=0.21.1", default-features = false, features = ["calloop"] }
pixman = "0.2"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "=0.3.12", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
libc = "0.2"
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "swash"] }

# Smithay 0.7.0 に、Seinas の側で見つけた不具合の直しを積んだ fork のブランチ(seinas/0.7.0)を、rev を固定して使う
# (docs/smithay-patches.md、ADR 0006)。
[patch.crates-io]
smithay = { git = "https://github.com/tsolsikke/smithay.git", rev = "891533e19ad5a7482eaa4804dfe28fa0c7a71c17" }
