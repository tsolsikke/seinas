[package]
name = "seinas-test-clients"
description = "Seinasのテスト用のクライアント。わざと不正な要求を送ったり、共有メモリーを縮めたり、届いたイベントを書き出したりする。"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "test-client"
path = "src/main.rs"

[dependencies]
# Waylandのライブラリは使わない(不正な要求を作るため、ソケットへ直接書く)。libcは、memfdとfdの受け渡しに使う。
libc = { workspace = true }
# --show-text のウィンドウと、--popup の IME の候補ウィンドウに、文字を描く。
seinas-text = { path = "../seinas-text" }
