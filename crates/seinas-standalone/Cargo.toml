[package]
name = "seinas-standalone"
description = "親のWaylandを使わない構成のSeinas。Waylandのフロントエンドで受けたクライアントの画面を、fbdevの画面へ present する。"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# 入れ子のバックエンド(SCTK、wayland-client)は入れない。tools/check-deps.sh が確かめている。
seinas-render = { path = "../seinas-render" }
seinas-frontend = { path = "../seinas-frontend" }
seinas-fbdev = { path = "../seinas-fbdev" }
smithay = { workspace = true, features = ["wayland_frontend", "renderer_pixman"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
seinas-golden = { path = "../seinas-golden" }
# テストの子のプロセスに PR_SET_PDEATHSIG を付ける(tests/common/mod.rs)。
libc = { workspace = true }

# 正解データ(golden)と比べる。正解データは tests/golden/ にある(docs/golden.md)。
[[test]]
name = "golden_layers"
harness = false
