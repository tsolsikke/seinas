[package]
name = "seinas-frontend"
description = "SeinasのWaylandの受け口(Smithay)。クライアントの要求を受け、描く要素を並べる。裏側には依存しない。"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# 裏側(入れ子のためのSCTKやwayland-client、fbdev)は、ここには入れない。
# desktop は、layer surface の並べ方(exclusive zone の計算)に使う。追加の依存は無い。
smithay = { workspace = true, features = ["wayland_frontend", "renderer_pixman", "desktop"] }
seinas-text = { path = "../seinas-text" }
tracing = { workspace = true }

[dev-dependencies]
seinas-golden = { path = "../seinas-golden" }

# 正解データ(golden)と比べる。正解データは tests/golden/ にある(docs/golden.md)。
[[test]]
name = "golden"
harness = false
