[package]
name = "seinas-fbdev"
description = "Seinasの裏側の1つ。共通の描画の結果を、Linuxのfbdev(/dev/fb0)の形で画面へ出す。"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
