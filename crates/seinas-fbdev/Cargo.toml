[package]
name = "seinas-fbdev"
description = "Seinasのバックエンドの1つ。共通のレンダラーの結果を、Linuxのfbdev(/dev/fb0)の形で画面へ present する。"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Waylandのフロントエンドは使わない。依存は、共通のレンダラーと、OSの呼び出しのためのlibcだけにする。
seinas-render = { path = "../seinas-render" }
libc = { workspace = true }

[dev-dependencies]
seinas-golden = { path = "../seinas-golden" }

# 正解データ(golden)と比べる。正解データは tests/golden/ にある(docs/golden.md)。
[[test]]
name = "golden"
harness = false
