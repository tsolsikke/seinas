[package]
name = "seinas"
description = "ZeikOS向けのWaylandコンポジタ。今は親のWaylandの中で動く入れ子の形。"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
seinas-render = { path = "../seinas-render" }
seinas-frontend = { path = "../seinas-frontend" }
smithay = { workspace = true, features = ["wayland_frontend", "renderer_pixman"] }
smithay-client-toolkit = { workspace = true }
wayland-client = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
libc = { workspace = true }

# Smithayの共有メモリー(wl_shm)が、いつスレッドを作り、いつSIGBUSの受け口を置き換えるかを確かめる。
# スレッドの数を数えるので、テストハーネス(スレッドを作る)は使わない。
[[test]]
name = "shm_lifecycle"
harness = false
